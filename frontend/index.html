<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("stockforge-theme") === "light"
            ? "light"
            : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StockForge keeps your products, stock movements, and team in sync. Manage inventory with clarity."
    />
    <title>StockForge | Inventory in sync</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
